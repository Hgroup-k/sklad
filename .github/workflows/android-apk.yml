# Собирает Android-приложение «Общий учёт» (TWA-обёртка над сайтом).
# APK собирается без подписи и кладётся в ветку android-apk;
# подпись ключом делается отдельно (ключ в репозиторий не попадает).
name: Android APK
on:
  push:
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Publish unsigned APK to branch android-apk
        run: |
          mkdir out && cp android/app/build/outputs/apk/release/*.apk out/obshchiy-uchet-unsigned.apk
          cd out && git init -q && git checkout -q -b android-apk
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          echo "Built from ${GITHUB_SHA}" > README.txt
          git add . && git commit -qm "APK from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" android-apk
